# Practice drill -- self-check only, carries no marks.
title: "Titanic: missing data and group differences"
dataset: titanic
description: >
  Practice at spotting missing values and comparing groups. Load titanic from
  Data > Load, then work through Profile and Explore > Group By / Summarize.

questions:
  - id: rows
    text: "How many passengers (rows) are in the dataset?"
    kind: numeric
    answer: 891
    tolerance: 1

  - id: missing_age
    text: "How many passengers have no Age recorded?"
    kind: numeric
    answer: 177
    tolerance: 1
    hint: "Data > Profile reports missing counts per column."
    explanation: >
      177 of 891 -- about 20%. Any mean age you calculate silently ignores
      those passengers, which is worth stating whenever you report it.

  - id: mean_age
    text: "What is the mean Age, to 2 decimal places?"
    kind: numeric
    answer: 29.70
    tolerance: 0.01
    explanation: "29.70, calculated from the 714 passengers who have an age."

  - id: survivors
    text: "How many passengers survived?"
    kind: numeric
    answer: 342
    tolerance: 1
    hint: "Survived is 1 for survived, 0 for not -- so summing it counts them."

  - id: female_rate
    text: "What percentage of female passengers survived? (1 decimal place)"
    kind: numeric
    answer: 74.2
    tolerance: 0.1
    hint: "Group by Sex and take the mean of Survived, then multiply by 100."
    explanation: >
      74.2% of women survived against 18.9% of men. Grouping turned a single
      average into the most important fact in the dataset.

  - id: biggest_class
    text: "Which passenger class has the most passengers?"
    kind: multiple_choice
    options: ["1", "2", "3"]
    answer: "3"
    explanation: "Third class, with 492 of the 891 passengers."
