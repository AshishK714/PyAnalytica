name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is what UIUC AnyWare ships, so it is what many students run.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev,all]"

      - name: Generate bundled datasets
        run: python -m pyanalytica.datasets.generate

      - name: Run tests
        # Every browser test must be ignored here: this job does not install
        # Chromium. Missing one costs a red matrix on all five interpreters.
        run: >-
          python -m pytest tests/ -v
          --ignore=tests/test_e2e.py
          --ignore=tests/test_e2e_datasets.py
          --ignore=tests/test_e2e_first_click.py
          --ignore=tests/test_e2e_transport.py
          --ignore=tests/test_e2e_timeline.py
          --ignore=tests/test_e2e_evaluate.py

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    # One Python version only. The matrix above exists to catch packaging and
    # dependency problems; the browser suite tests UI behaviour, which does not
    # vary by interpreter, and each run costs ~6 minutes of a browser session.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,all]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Generate bundled datasets
        run: python -m pyanalytica.datasets.generate

      - name: Run end-to-end tests
        # Both browser files in one run: they passed separately and failed
        # together once, because each loads datasets the other does not.
        run: >-
          python -m pytest
          tests/test_e2e.py
          tests/test_e2e_datasets.py
          tests/test_e2e_first_click.py
          tests/test_e2e_transport.py
          tests/test_e2e_timeline.py
          tests/test_e2e_evaluate.py
          -v
        env:
          MPLBACKEND: Agg

  build:
    name: Build package
    runs-on: ubuntu-latest
    # Only build once the code is known good, so a green build badge cannot
    # sit above a failing suite.
    needs: [test, e2e]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,all]"

      - name: Generate bundled datasets
        run: python -m pyanalytica.datasets.generate

      - name: Build package
        run: |
          pip install build twine
          python -m build

      - name: Check package metadata
        run: twine check dist/*
